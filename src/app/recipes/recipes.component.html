<div class="row">
  <div class="col-md-5">
    <app-recipe-list
      (recipeSelected)="onRecipeSelected($event)"
    ></app-recipe-list>
  </div>
  <div class="col-md-7">
    <app-recipe-detail
      *ngIf="selectedRecipe; else selectRecipeText"
      [recipe]="selectedRecipe"
    ></app-recipe-detail>
    <ng-template #selectRecipeText
      ><p>Please selecte a recipe to see its details!</p></ng-template
    >
  </div>
</div>
